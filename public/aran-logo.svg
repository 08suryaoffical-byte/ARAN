<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="45%" stop-color="#0E7490" />
      <stop offset="85%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Shield / Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="80%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Cyan Pulse Glow -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Ambient Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Container / App Icon Tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="4" />

  <!-- Subtle Radial Ambient Highlights -->
  <circle cx="160" cy="140" r="180" fill="#38BDF8" opacity="0.12" filter="url(#glow)" />
  <circle cx="360" cy="380" r="140" fill="#818CF8" opacity="0.10" filter="url(#glow)" />

  <!-- Outer Protective Halo Ring -->
  <circle cx="256" cy="226" r="156" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Protective Cradling Hands / Wings Silhouette (Care & Guardianship) -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- Left Cradling Arc -->
    <path d="M 148 270 C 132 230, 140 176, 178 144 C 196 128, 222 126, 238 138" />
    <!-- Right Cradling Arc -->
    <path d="M 364 270 C 380 230, 372 176, 334 144 C 316 128, 290 126, 274 138" />
  </g>

  <!-- Central Heart (Vitality & Care) -->
  <path d="M 256 324
           C 246 312, 160 236, 160 178
           C 160 142, 188 116, 222 116
           C 242 116, 250 126, 256 136
           C 262 126, 270 116, 290 116
           C 324 116, 352 142, 352 178
           C 352 236, 266 312, 256 324 Z"
        fill="url(#heartGrad)"
        filter="url(#shadow)"
        stroke="#FCA5A5"
        stroke-width="3"
        stroke-opacity="0.4" />

  <!-- Dynamic ECG Heartbeat Pulse Lifeline running across the Heart -->
  <g filter="url(#glow)">
    <path d="M 120 220 
             L 186 220 
             L 198 206 
             L 210 220 
             L 226 220 
             L 238 238 
             L 256 150 
             L 274 278 
             L 286 220 
             L 302 220 
             L 314 204 
             L 326 220 
             L 392 220"
          fill="none"
          stroke="url(#pulseGrad)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Core Pulse Light Sparkle on Peak -->
  <circle cx="256" cy="150" r="7" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="256" cy="150" r="3.5" fill="#38BDF8" />

  <!-- App Title "ARAN" -->
  <g text-anchor="middle">
    <text x="256" y="408"
          fill="#FFFFFF"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
          font-size="52"
          font-weight="900"
          letter-spacing="9"
          style="text-transform: uppercase;">
      ARAN
    </text>
    
    <!-- Subtitle: Every Heartbeat Deserves Safety -->
    <text x="256" y="440"
          fill="#67E8F9"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
          font-size="14.5"
          font-weight="700"
          letter-spacing="2.2"
          opacity="0.95">
      EVERY HEARTBEAT DESERVES SAFETY
    </text>
  </g>
</svg>
